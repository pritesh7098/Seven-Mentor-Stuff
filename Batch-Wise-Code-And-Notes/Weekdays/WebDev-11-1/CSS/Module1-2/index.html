<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <!-- Internal CSS - now the style is acting as a tag here rather than attribute -->

    <style>
      h2 {
        background-color: brown;
        color: white;
      }
    </style>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Inline css here  -->
    <h1 style="background-color: antiquewhite">Types of CSS</h1>
    <hr />
    <h2>Welcome to css class</h2>
    <hr />
    <h3>CSS stands for cascading style sheets</h3>
  </body>
</html>
