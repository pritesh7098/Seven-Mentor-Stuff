<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attributes in HTML</title>
  </head>
  <body>
    <h1 style="color: red">HTML Attributes</h1>
    <hr />

    <!-- styles attribute - allows you to style the element in inline way -->

    <button
      title="click here to view content"
      style="border: 2px solid black; background-color: antiquewhite"
    >
      Click me
    </button>

    <!-- title attribute basically provides more info about the content  -->

    <!-- --------------------------------- -->

    <!-- Element specific attributes  -->

    <br />
    <br />

    <a href="https://www.google.com" target="_blank">Click to Visit Google</a>

    <!-- some attributes are element specific only like href is limited to a tag -->
<br>
<br>

    <img src="./Screenshot 2026-10-27 152225.png" alt="This is a image">
    <!-- src and alt are image specific attributes  -->




  </body>
</html>
