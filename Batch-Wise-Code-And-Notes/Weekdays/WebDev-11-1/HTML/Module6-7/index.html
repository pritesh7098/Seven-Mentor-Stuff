<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Images and media in html 5</h1>
    <hr />
    <img src="dog.jp" alt="This is image" />
    <!-- alt attribute works only when there is no image/ problem while loading the image  -->
    <hr />
    <audio controls>
      <source src="sample-15s.mp3" type="audio/mpeg" />
      Your browser does not support audio.
    </audio>

    <hr />

    <!-- you can add multiple attributes to a video tag -->

    <video controls autoplay mute loop width="400">
      <source src="sample-5s.mp " type="video/mp4" />

      Your browser does not support video
    </video>

    <!-- ----------------------------------------- -->

    <hr />

    <!-- Lists in HTML 
    -->

    <ul>
      <li>HTML</li>
      <li>Javascript</li>
      <li>React</li>
    </ul>

    <hr />

    <!-- where order doesen't matter -->

    <ol>
      <li>Step1</li>
      <li>step2</li>
      <li>step3</li>
    </ol>
    <hr />
    <!-- when order actually matters -->

    <dl>
      <dt>HTML :</dt>
      <dd>Hypertext markup language</dd>

      <dt>CSS :</dt>
      <dd>It is used for styling html webpage</dd>
    </dl>

    <!-- used mainly for def and FAQ's -->
  </body>
</html>
