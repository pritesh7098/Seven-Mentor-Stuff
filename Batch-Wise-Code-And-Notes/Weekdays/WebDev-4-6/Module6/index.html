<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Module6- media in html 5</title>
  </head>
  <body>
    <h1>Media in HTML</h1>

    <img src="meta.png" alt="brand logo" width="300" height="150" />

    <br />
    <hr />

    <!-- you can use height and width here or can use css as well  -->

    <audio controls>
      <source src="bensound-slowlife.mp3" type="audio/mpeg" />

      Your browser does not support this content
    </audio>
    <br />
    <hr />

    <!-- Video  -->

    <video controls width="400" autoplay muted>
      <source src="sample-5s.mp4" type="video/mp4" />
      This video type is not supported
    </video>
    <br><hr>
  </body>
</html>
