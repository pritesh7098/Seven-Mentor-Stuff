<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lists In HTML</title>
  </head>
  <body>
    <!-- Unordered list  -->

    <ul>
      <li>HTML</li>
      <li>CSs</li>
      <li>JS</li>
      <li>React</li>
      <li>Postman</li>
      <li>Git</li>
    </ul>

    <!-- Ordered list -->

    <ol type="I">
      <li>Step1</li>
      <li>Step2</li>
      <li>Step3</li>
    </ol>

    <!-- Description list  -->

    <dl>
      <dt>What is JS</dt>
      <dd>JS is an hig level, interpreted programming language</dd>
    </dl>
  </body>
</html>
