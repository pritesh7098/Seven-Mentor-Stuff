<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Tables</title>
  </head>
  <body>
    <h1>Tables In HTML</h1>
    <!-- Tables code starts from here -->

    <table border="1" ellpadding="10" cellspacing="10" >
        <caption>Student's Data</caption>
      <tr>
        <th>Name</th>
        <th>Age</th>
        <th>Address</th>
      </tr>
      <tr>
        <td>Pritesh</td>
        <td>24</td>
        <td>Shirdi</td>
      </tr>
      <tr>
        <td>Rahul</td>
        <td>25</td>
        <td>PCMC</td>
      </tr>
      <tr>
        <td>Om</td>
        <td>30</td>
        <td>Pune</td>
      </tr>
    </table>
  </body>
</html>
